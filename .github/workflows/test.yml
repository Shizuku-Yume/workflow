name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # macOS ships Bash 3.2 and BSD realpath without -m; the CLI needs Bash 4.3+
      # and GNU realpath, and the tests use GNU sed -i. README documents the same setup.
      - name: Install GNU tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils gnu-sed
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh

      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: Run tests
        run: |
          bash --version | head -n 1
          bash tests/cli-tests.sh
